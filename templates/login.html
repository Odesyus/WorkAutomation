<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - Otomasyon Platformu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/corporate.css">
    <link rel="stylesheet" href="/static/css/modern.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: var(--bg, #0f172a);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text, #e2e8f0);
            padding: 20px;
            box-sizing: border-box;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            background: var(--surface, rgba(30, 41, 59, 0.7));
            border: 1px solid var(--surface-border, rgba(255, 255, 255, 0.1));
            border-radius: var(--radius, 16px);
            box-shadow: var(--shadow, 0 10px 40px rgba(0, 0, 0, 0.35));
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 36px 32px;
            box-sizing: border-box;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .login-logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            background: var(--btn-primary-bg, linear-gradient(135deg, #00d4ff, #7c3aed));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #fff;
            box-shadow: var(--btn-primary-shadow, 0 6px 24px rgba(0, 212, 255, 0.35));
        }

        .login-header h1 {
            font-size: 1.5rem;
            margin: 0 0 8px 0;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .login-header p {
            color: var(--text-muted, #94a3b8);
            font-size: 0.88rem;
            margin: 0;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.86rem;
            font-weight: 600;
            color: var(--text, #e2e8f0);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            color: var(--text-muted, #94a3b8);
            font-size: 1rem;
            pointer-events: none;
            transition: color 0.2s;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            background: var(--input-bg, rgba(255, 255, 255, 0.05));
            border: 1px solid var(--input-border, rgba(255, 255, 255, 0.12));
            border-radius: var(--radius-sm, 10px);
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-wrapper input:focus {
            border-color: var(--primary, #00d4ff);
            box-shadow: var(--focus-ring, 0 0 0 3px rgba(0, 212, 255, 0.25));
        }

        .input-wrapper input:focus + i,
        .input-wrapper input:focus ~ i {
            color: var(--primary, #00d4ff);
        }

        .btn-login {
            width: 100%;
            padding: 13px;
            background: var(--btn-primary-bg, linear-gradient(135deg, #00d4ff, #7c3aed));
            border: none;
            border-radius: var(--radius-sm, 10px);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: var(--btn-primary-shadow, 0 6px 20px rgba(0, 212, 255, 0.3));
            transition: transform 0.15s, opacity 0.2s;
            margin-top: 10px;
        }

        .btn-login:hover:not(:disabled) {
            transform: translateY(-1px);
            opacity: 0.95;
        }

        .btn-login:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .alert-box {
            display: none;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 0.86rem;
            margin-bottom: 20px;
            align-items: center;
            gap: 10px;
            line-height: 1.4;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #fca5a5;
        }

        .alert-info {
            background: rgba(0, 212, 255, 0.12);
            border: 1px solid rgba(0, 212, 255, 0.3);
            color: #67e8f9;
        }

        .login-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 0.78rem;
            color: var(--text-muted, #94a3b8);
            line-height: 1.45;
            border-top: 1px solid var(--surface-border, rgba(255, 255, 255, 0.08));
            padding-top: 18px;
        }
    </style>
</head>
<body class="theme-modern">
    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">
                <i class="fas fa-satellite-dish"></i>
            </div>
            <h1>Otomasyon Platformu</h1>
            <p>Devam etmek için Sicil / Domain ID ve Şifreniz ile giriş yapın.</p>
        </div>

        <div id="alert-box" class="alert-box alert-error">
            <i class="fas fa-exclamation-circle"></i>
            <span id="alert-text"></span>
        </div>

        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username"><i class="fas fa-id-badge"></i> Sicil / Domain ID</label>
                <div class="input-wrapper">
                    <input type="text" id="username" name="username" placeholder="Sicil / Domain ID giriniz" required autofocus autocomplete="username">
                    <i class="fas fa-user"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="password"><i class="fas fa-lock"></i> Sicil / Domain ID Şifre</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" placeholder="Şifrenizi giriniz" required autocomplete="current-password">
                    <i class="fas fa-key"></i>
                </div>
            </div>

            <button type="submit" class="btn-login" id="btn-submit">
                <i class="fas fa-sign-in-alt"></i>
                <span id="btn-text">Giriş Yap</span>
            </button>
        </form>

        <div class="login-footer">
            <i class="fas fa-shield-alt"></i> Giriş bilgileriniz güvenle doğrulanır ve diğer sistem otomasyonlarında da otomatik olarak kullanılır.
        </div>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            const btnText = document.getElementById('btn-text');
            const alertBox = document.getElementById('alert-box');
            const alertText = document.getElementById('alert-text');

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!username || !password) {
                showAlert('Lütfen Sicil No ve Şifrenizi eksiksiz girin.');
                return;
            }

            hideAlert();
            btn.disabled = true;
            btnText.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Doğrulanıyor...';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    btnText.innerHTML = '<i class="fas fa-check"></i> Giriş Başarılı!';
                    // Yönlendirme
                    const urlParams = new URLSearchParams(window.location.search);
                    const next = urlParams.get('next') || '/';
                    window.location.href = next;
                } else {
                    showAlert(data.error || 'Giriş başarısız. Lütfen bilgilerinizi kontrol edin.');
                    btn.disabled = false;
                    btnText.textContent = 'Giriş Yap';
                }
            } catch (err) {
                showAlert('Sunucuya bağlanırken bir hata oluştu: ' + err.message);
                btn.disabled = false;
                btnText.textContent = 'Giriş Yap';
            }
        }

        function showAlert(msg) {
            const alertBox = document.getElementById('alert-box');
            const alertText = document.getElementById('alert-text');
            alertText.textContent = msg;
            alertBox.style.display = 'flex';
        }

        function hideAlert() {
            const alertBox = document.getElementById('alert-box');
            alertBox.style.display = 'none';
        }
    </script>
</body>
</html>
